<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RakeshAi — Welcome</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Animated Gradient Background */
    .mesh-bg {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, hsla(253,100%,77%,0.2) 0px, transparent 50%),
        radial-gradient(at 100% 0%, hsla(202,100%,76%,0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, hsla(339,100%,79%,0.18) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(177,100%,79%,0.2) 0px, transparent 50%);
    }

    /* Floating Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    .float-card {
      animation: float 6s ease-in-out infinite;
    }

    /* Subtle Glass Border */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 50px -12px rgba(100, 116, 139, 0.12);
    }
  </style>

  <!-- Firebase Scripts (Compat Version for Standalone HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="mesh-bg min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-hidden relative selection:bg-purple-100 selection:text-purple-900">

  <!-- Background Decorative Glowing Orbs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-300/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Login Container -->
  <div class="max-w-md w-full glass-card rounded-3xl p-8 sm:p-10 relative z-10 transition-all duration-300 hover:shadow-2xl">
    
    <!-- Brand / Logo Area -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-400 p-[2px] shadow-lg shadow-purple-500/20 float-card">
        <div class="w-full h-full bg-white rounded-2xl flex items-center justify-center">
          <svg class="w-8 h-8 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
          </svg>
        </div>
      </div>

      <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">
        Rakesh<span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Ai</span>
      </h1>
      <p class="text-slate-500 text-sm mt-2 font-medium">Intelligent Multi-Model Neural Workspace</p>
    </div>

    <!-- Features Pill Badges -->
    <div class="flex flex-wrap justify-center gap-2 mb-8 text-xs font-semibold text-slate-600">
      <span class="px-3 py-1 rounded-full bg-indigo-50/80 border border-indigo-100/80 text-indigo-700">⚡ Gemini Flash</span>
      <span class="px-3 py-1 rounded-full bg-orange-50/80 border border-orange-100/80 text-orange-700">🦊 Mistral AI</span>
      <span class="px-3 py-1 rounded-full bg-blue-50/80 border border-blue-100/80 text-blue-700">🌐 OpenRouter</span>
    </div>

    <!-- Alert / Notice Box -->
    <div id="statusMessage" class="hidden mb-6 p-3.5 rounded-xl text-xs font-medium border text-center transition-all duration-300"></div>

    <!-- Google Sign In Button -->
    <button id="googleLoginBtn" class="w-full py-4 px-6 rounded-2xl bg-white hover:bg-slate-50 active:scale-[0.98] border border-slate-200 text-slate-700 font-bold text-sm shadow-sm hover:shadow-md transition-all duration-200 flex items-center justify-center space-x-3 group">
      <!-- Google SVG -->
      <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span class="tracking-wide">Continue with Google</span>
    </button>

    <!-- Footer Security Note -->
    <div class="mt-8 text-center text-xs text-slate-400 font-medium">
      🔒 Protected with Firebase Authentication. Guest access restricted.
    </div>

  </div>

  <script>
    // ⚠️ PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyBg_b1Ju50LiIgkgLdxmfZOm-rAGOi0sEM",
        authDomain: "rakeshai-web.firebaseapp.com",
        projectId: "rakeshai-web",
        storageBucket: "rakeshai-web.firebasestorage.app",
        messagingSenderId: "1095603512241",
        appId: "1:1095603512241:web:5e5cdbf6ebf14f8259d390",
        measurementId: "G-1LYSX7VKCY"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // Check if user is already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        localStorage.setItem('user', JSON.stringify({
          name: user.displayName,
          email: user.email,
          photo: user.photoURL,
          uid: user.uid
        }));
        window.location.href = 'index.html';
      }
    });

    // Google Sign-In Handler
    const googleBtn = document.getElementById('googleLoginBtn');
    const statusBox = document.getElementById('statusMessage');

    googleBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      googleBtn.classList.add('opacity-75', 'pointer-events-none');
      googleBtn.innerText = "Signing in...";

      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        
        localStorage.setItem('user', JSON.stringify({
          name: user.displayName,
          email: user.email,
          photo: user.photoURL,
          uid: user.uid
        }));

        window.location.href = 'index.html';
      } catch (error) {
        console.error("Login Error:", error);
        statusBox.classList.remove('hidden');
        statusBox.className = "mb-6 p-3.5 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200 block text-center";
        statusBox.innerText = error.message || "Login failed. Check your Firebase credentials.";

        googleBtn.classList.remove('opacity-75', 'pointer-events-none');
        googleBtn.innerHTML = `
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span class="tracking-wide">Continue with Google</span>
        `;
      }
    });
  </script>
</body>
</html>
